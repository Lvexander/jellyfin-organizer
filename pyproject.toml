[project]
name = "jellyfin-organizer"
version = "0.1.0"
description = "Organize downloaded anime/movie/TV episodes into a Jellyfin-compatible structure using MyAnimeList and TMDB."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[tool.uv]
# Script project: install dependencies only, do not build/install the project itself.
package = false
